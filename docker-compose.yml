services:
  db:
    build:
      context: .
      dockerfile: ./database/Dockerfile
    container_name: inibsa_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/00-init.sql
      - postgres_data:/var/lib/postgresql
    networks:
      - inibsa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
      build: ./frontend
      container_name: inibsa_ui
      ports:
        - "8501:8501"
      depends_on:
        db:
          condition: service_healthy
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      networks:
        - inibsa_network
volumes:
  postgres_data:

networks:
  inibsa_network:
    driver: bridge