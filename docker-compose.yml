services:
  db:
    build:
      context: .
      dockerfile: ./database/Dockerfile
    container_name: inibsa_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/00-init.sql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inibsa_network

  analytics:
    build:
      context: .
      dockerfile: ./analytics/Dockerfile
    container_name: inibsa_analytics
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      FECHA_HOY: "2026-02-01"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./analytics/models:/app/analytics/models
    networks:
      - inibsa_network

  frontend:
      build: ./frontend
      container_name: inibsa_ui
      ports:
        - "8501:8501"
      depends_on:
        db:
          condition: service_healthy
      environment:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      networks:
        - inibsa_network
        - red_proxy

networks:
  inibsa_network:
    driver: bridge
  red_proxy:
    external: true

volumes:
  postgres_data: